name: check

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/**"
      - ".github/workflows/check.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "plugins/**"
      - ".github/workflows/check.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Function hooks are early access, so CI pins the CLI the plugins were last verified with.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.288

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate and test plugins
        run: |
          for dir in plugins/*/; do
            claude plugin validate "$dir"
            # `claude plugin test` exits 1 on a plugin without a hooks module (skills-only).
            if [ -f "$dir/hooks/hooks.json" ]; then
              claude plugin test "$dir"
            fi
          done

      # The engine writes a plugin's API types beside it when it loads the plugin, before the login
      # check, so this run fails with "Not logged in" yet leaves the types; the test catches a CLI
      # that stops writing them.
      - name: Type-check plugins
        run: |
          for dir in plugins/*/; do
            [ -f "$dir/tsconfig.json" ] || continue
            timeout 120 claude --plugin-dir "$dir" -p ok --max-turns 1 < /dev/null > /dev/null 2>&1 || true
            if [ ! -f "$dir/.claude-plugin/types/tsconfig.json" ]; then
              echo "::error::Claude Code did not write the engine types for $dir"
              exit 1
            fi
            npx -y -p typescript@5.9.3 tsc -p "$dir"
          done
